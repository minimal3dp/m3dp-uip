name: E2E Tests

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv pip install -e '.[dev]'

      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null; then echo "Backend up"; break; fi; sleep 1; done
          curl -s http://localhost:8000/docs || (echo "Backend failed" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev &
          echo "Waiting for frontend..."
          for i in {1..40}; do
            if curl -s http://localhost:3000 > /dev/null; then echo "Frontend up"; break; fi; sleep 1; done
          curl -s http://localhost:3000 || (echo "Frontend failed" && exit 1)

      - name: Run Playwright tests
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000
        run: npx playwright test --reporter=line

      - name: Upload Playwright Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
