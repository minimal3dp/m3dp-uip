name: Frontend E2E Badge

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  e2e-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect frontend & backend Python project
        id: detect
        run: |
          if [ -d frontend ]; then echo "frontend=true" >> $GITHUB_OUTPUT; else echo "frontend=false" >> $GITHUB_OUTPUT; fi
          if [ -d backend ] && { [ -f backend/pyproject.toml ] || [ -f backend/setup.py ]; }; then echo "backend=true" >> $GITHUB_OUTPUT; else echo "backend=false" >> $GITHUB_OUTPUT; fi
          echo "Frontend present: $(grep frontend $GITHUB_OUTPUT | cut -d= -f2)" || true
          echo "Backend present: $(grep backend $GITHUB_OUTPUT | cut -d= -f2)" || true

      - name: Set up Python
        if: steps.detect.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: steps.detect.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps (UV)
        if: steps.detect.outputs.backend == 'true'
        run: |
          pip install uv
          cd backend
          if [ ! -d .venv ]; then
            echo "Creating uv virtual environment";
            uv venv .venv || uv venv || true;
          fi
          if ! uv pip install -e '.[dev]'; then
            echo "Editable install failed; retrying system install";
            uv pip install --system -e '.[dev]' || uv pip install --system . || { echo "Backend dependency install failed"; exit 2; };
          fi

      - name: Install frontend deps
        if: steps.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start backend
        if: steps.detect.outputs.backend == 'true'
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null; then echo "Backend up"; break; fi; sleep 1; done
          curl -s http://localhost:8000/docs || (echo "Backend failed" && exit 1)

      - name: Start frontend
        if: steps.detect.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm run dev &
          echo "Waiting for frontend..."
          for i in {1..40}; do
            if curl -s http://localhost:3000 > /dev/null; then echo "Frontend up"; break; fi; sleep 1; done
          curl -s http://localhost:3000 || (echo "Frontend failed" && exit 1)

      - name: Run Playwright tests (JSON)
        if: steps.detect.outputs.frontend == 'true' && steps.detect.outputs.backend == 'true'
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000
        run: |
          npx playwright test --reporter=json > ../playwright-report.json || true
          cd ..
          test -f playwright-report.json || echo '{}' > playwright-report.json
          ls -l playwright-report.json || true

      - name: Create empty report (no backend)
        if: steps.detect.outputs.frontend == 'true' && steps.detect.outputs.backend != 'true'
        run: echo '{}' > playwright-report.json

      - name: Generate badge
        if: steps.detect.outputs.frontend == 'true'
        run: python scripts/generate_playwright_badge.py || echo "Badge script missing; skipped"

      - name: Commit badge
        if: steps.detect.outputs.frontend == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add frontend-e2e-badge.svg || true
          if git diff --cached --quiet; then echo "No badge changes"; else git commit -m "chore: update frontend e2e badge"; git push; fi

      - name: Upload badge artifact
        if: steps.detect.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-badge
          path: frontend-e2e-badge.svg
          retention-days: 7

      - name: Badge skipped notice
        if: steps.detect.outputs.frontend != 'true'
        run: echo "Frontend badge skipped (no frontend present)."
