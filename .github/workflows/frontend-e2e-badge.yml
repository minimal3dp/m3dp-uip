name: Frontend E2E Badge

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  e2e-badge:
    if: ${{ hashFiles('frontend/**') != '' && hashFiles('backend/**') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps (UV)
        run: pip install uv && cd backend && uv pip install -e '.[dev]'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/docs > /dev/null; then echo "Backend up"; break; fi; sleep 1; done
          curl -s http://localhost:8000/docs || (echo "Backend failed" && exit 1)

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev &
          echo "Waiting for frontend..."
          for i in {1..40}; do
            if curl -s http://localhost:3000 > /dev/null; then echo "Frontend up"; break; fi; sleep 1; done
          curl -s http://localhost:3000 || (echo "Frontend failed" && exit 1)

      - name: Run Playwright tests (JSON)
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000
        run: |
          npx playwright test --reporter=json > ../playwright-report.json || true
          # Ensure report file exists to prevent workflow failure
          cd ..
          test -f playwright-report.json || echo '{}' > playwright-report.json
          # Do not commit report; used only for badge generation
          ls -l playwright-report.json || true

      - name: Generate badge
        run: |
          python - <<'PY'
          import os
          p = 'playwright-report.json'
          try:
              txt = open(p, 'r', encoding='utf-8').read()
              has_tests = 'status' in txt or 'tests' in txt
          except Exception:
              has_tests = False
          label = 'E2E'
          if not has_tests:
              color = '#999999'
              message = 'no tests'
          else:
              color = '#4c1'
              message = 'ok'
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="110" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="110" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <rect width="55" height="20" fill="#555"/>
              <rect x="55" width="55" height="20" fill="{color}"/>
              <rect width="110" height="20" fill="url(#b)"/>
            </g>
            <g fill="#fff" text-anchor="middle"
               font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="27.5" y="14">{label}</text>
              <text x="82.5" y="14">{message}</text>
            </g>
          </svg>'''
          with open('frontend-e2e-badge.svg', 'w', encoding='utf-8') as f:
              f.write(svg)
          print('Wrote frontend-e2e-badge.svg')
          PY

      - name: Commit badge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add frontend-e2e-badge.svg || true
          if git diff --cached --quiet; then echo "No badge changes"; else git commit -m "chore: update frontend e2e badge"; git push; fi

      - name: Upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-badge
          path: frontend-e2e-badge.svg
          retention-days: 7
