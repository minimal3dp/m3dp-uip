{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto p-6">
  <a href="/calculators-ui" class="inline-flex items-center text-brand-orange hover:underline mb-6">← Back to Calculators</a>

  <div class="glass rounded-2xl p-8 bg-zinc-900">
    <h2 class="text-2xl font-bold mb-6 flex items-center gap-2"><span class="text-3xl">📏</span> Line Width Recommendations</h2>
    <p class="text-zinc-400 mb-8">Get recommended line width ranges for different print features based on your nozzle size.</p>

    <div x-data="{
      nozzleDiameter: 0.4, featureType: 'perimeter', layerHeight: null, result: null, error: null, loading: false,
      async calculate() {
        this.loading = true; this.error = null;
        try {
          const response = await fetch('/api/v1/calculators/line-widths', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nozzle_diameter: this.nozzleDiameter, feature_type: this.featureType, layer_height: this.layerHeight || null})
          });
          if (!response.ok) throw new Error('Calculation failed');
          this.result = await response.json();
        } catch (e) { this.error = e.message; } finally { this.loading = false; }
      },
      reset() { this.nozzleDiameter = 0.4; this.featureType = 'perimeter'; this.layerHeight = null; this.result = null; this.error = null; },
      copyToClipboard(text) { navigator.clipboard.writeText(text); alert('Copied!'); }
    }">
      <form @submit.prevent="calculate" class="space-y-6">
        <div>
          <label class="block text-sm font-medium mb-2">Nozzle Diameter (mm)</label>
          <input x-model.number="nozzleDiameter" type="number" step="0.1" min="0.1" max="2" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-brand-orange transition" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Feature Type</label>
          <select x-model="featureType" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-brand-orange transition">
            <option value="external_perimeter">External Perimeter</option>
            <option value="perimeter">Perimeter</option>
            <option value="solid_infill">Solid Infill</option>
            <option value="sparse_infill">Sparse Infill</option>
            <option value="first_layer">First Layer</option>
            <option value="support">Support</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Layer Height (Optional)</label>
          <input x-model.number="layerHeight" type="number" step="0.01" min="0.04" max="1" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-3 focus:outline-none focus:border-brand-orange transition" />
        </div>
        <div x-show="error" class="bg-red-500/10 border border-red-500/50 rounded-lg p-4 text-red-400 text-sm" x-text="error"></div>
        <div class="flex gap-4">
          <button type="submit" :disabled="loading" class="flex-1 bg-brand-orange hover:bg-orange-600 disabled:bg-zinc-700 disabled:cursor-not-allowed text-white px-6 py-3 rounded-lg font-medium transition" x-text="loading ? 'Calculating...' : 'Get Recommendations'"></button>
          <button type="button" @click="reset" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg font-medium transition">Reset</button>
        </div>
      </form>

      <div x-show="result" class="mt-8 glass-dark rounded-xl p-6 border-l-4 border-brand-orange">
        <h3 class="text-xl font-bold mb-4 flex items-center gap-2"><span>✅</span> Recommendations</h3>
        <div class="space-y-4">
          <div class="grid grid-cols-3 gap-4">
            <div><p class="text-sm text-zinc-400">Min Width:</p><p class="text-lg font-bold text-brand-orange"><span x-text="result?.recommended_min"></span> mm</p></div>
            <div><p class="text-sm text-zinc-400">Target Width:</p><p class="text-lg font-bold text-green-400"><span x-text="result?.default_target"></span> mm</p></div>
            <div><p class="text-sm text-zinc-400">Max Width:</p><p class="text-lg font-bold text-brand-orange"><span x-text="result?.recommended_max"></span> mm</p></div>
          </div>
          <div class="bg-zinc-950 rounded-lg p-4 font-mono text-sm">
            <p class="text-zinc-500 text-xs mb-2">Slicer Setting:</p>
            <code class="text-green-400" x-text="result?.slicer_config"></code>
            <button @click="copyToClipboard(result?.slicer_config)" class="mt-2 text-xs text-brand-orange hover:underline">📋 Copy</button>
          </div>
          <div class="bg-blue-500/10 border border-blue-500/50 rounded-lg p-4"><p class="text-sm text-zinc-300" x-text="result?.notes"></p></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
