<!-- Search Modal Component -->
<div x-data="searchModal()" class="relative z-[100]" role="dialog" aria-modal="true" x-show="isOpen" x-cloak
    @keydown.window.cmd.k.prevent="toggle()" @keydown.window.ctrl.k.prevent="toggle()"
    @keydown.escape.window="isOpen = false" style="display: none;">

    <!-- Backdrop -->
    <div x-show="isOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-zinc-900/80 backdrop-blur-sm transition-opacity" @click="isOpen = false"></div>

    <!-- Modal Panel -->
    <div class="fixed inset-0 z-10 w-screen overflow-y-auto p-4 sm:p-6 md:p-20">
        <div x-show="isOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100" x-transition:leave="ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"
            class="mx-auto max-w-2xl transform divide-y divide-white/10 overflow-hidden rounded-xl bg-zinc-900 shadow-2xl ring-1 ring-white/10 transition-all">

            <!-- Search Input -->
            <div class="relative">
                <svg class="pointer-events-none absolute left-4 top-3.5 h-5 w-5 text-zinc-400" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text"
                    class="h-12 w-full border-0 bg-transparent pl-11 pr-4 text-white placeholder:text-zinc-500 focus:ring-0 sm:text-sm"
                    placeholder="Search ... (Type 'flow', 'skew', 'ghosting')" x-model="query" x-ref="searchInput"
                    @keydown.arrow-down.prevent="selectNext()" @keydown.arrow-up.prevent="selectPrev()"
                    @keydown.enter.prevent="selectResult()">
            </div>

            <!-- Results List -->
            <ul x-show="results.length > 0" class="max-h-96 scroll-py-2 overflow-y-auto py-2 text-sm text-zinc-400">
                <template x-for="(item, index) in results" :key="item.title">
                    <li class="group cursor-pointer select-none px-4 py-2"
                        :class="{ 'bg-brand-orange/10 text-brand-orange': index === selectedIndex }"
                        @click="navigateTo(item.url)" @mouseenter="selectedIndex = index">
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="font-semibold text-white"
                                    :class="{ 'text-brand-orange': index === selectedIndex }" x-text="item.title"></div>
                                <div class="text-xs text-zinc-500" x-text="item.description"></div>
                            </div>
                            <span
                                class="ml-3 flex-none rounded-md bg-zinc-800 px-2 py-0.5 text-xs font-medium text-zinc-400 lowercase"
                                x-text="item.category"></span>
                        </div>
                    </li>
                </template>
            </ul>

            <!-- Empty State -->
            <div x-show="query.length > 0 && results.length === 0" class="px-6 py-14 text-center text-sm sm:px-14">
                <svg class="mx-auto h-6 w-6 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                </svg>
                <p class="mt-4 font-semibold text-white">No results found</p>
                <p class="mt-2 text-zinc-400">Try searching for 'flow', 'calibration', or specific issue types.</p>
            </div>

            <!-- Instructions Footer -->
            <div
                class="flex flex-wrap items-center bg-zinc-900/50 px-4 py-2.5 text-xs text-zinc-400 border-t border-white/5">
                <span class="mr-4 flex items-center">
                    <kbd
                        class="mx-1 flex h-5 w-5 items-center justify-center rounded border border-zinc-700 bg-zinc-800 font-sans font-medium text-zinc-400">↓</kbd>
                    <kbd
                        class="mx-1 flex h-5 w-5 items-center justify-center rounded border border-zinc-700 bg-zinc-800 font-sans font-medium text-zinc-400">↑</kbd>
                    to navigate
                </span>
                <span class="mr-4 flex items-center">
                    <kbd
                        class="mx-1 flex h-5 w-5 items-center justify-center rounded border border-zinc-700 bg-zinc-800 font-sans font-medium text-zinc-400">↵</kbd>
                    to select
                </span>
                <span class="flex items-center">
                    <kbd
                        class="mx-1 flex h-5 w-5 items-center justify-center rounded border border-zinc-700 bg-zinc-800 font-sans font-medium text-zinc-400">Esc</kbd>
                    to close
                </span>
            </div>
        </div>
    </div>
</div>

<script>
    function searchModal() {
        return {
            isOpen: false,
            query: '',
            items: [],
            results: [],
            selectedIndex: 0,

            async init() {
                // Fetch index on load
                try {
                    const response = await fetch('/api/v1/calculators/search-index');
                    const data = await response.json();
                    this.items = data.items;
                } catch (e) {
                    console.error("Failed to load search index", e);
                }

                // Simple search watcher
                this.$watch('query', (value) => {
                    this.selectedIndex = 0;
                    if (!value) {
                        this.results = [];
                        return;
                    }

                    // Simple filtering - can upgrade to Fuse.js if needed
                    const lowerQuery = value.toLowerCase();
                    this.results = this.items.filter(item => {
                        return (item.title && item.title.toLowerCase().includes(lowerQuery)) ||
                            (item.description && item.description.toLowerCase().includes(lowerQuery)) ||
                            (item.keywords && item.keywords.toLowerCase().includes(lowerQuery));
                    }).slice(0, 10); // Limit to 10
                });
            },

            toggle() {
                this.isOpen = !this.isOpen;
                if (this.isOpen) {
                    this.$nextTick(() => {
                        this.$refs.searchInput.focus();
                        this.query = '';
                        this.results = [];
                    });
                }
            },

            selectNext() {
                if (this.selectedIndex < this.results.length - 1) {
                    this.selectedIndex++;
                }
            },

            selectPrev() {
                if (this.selectedIndex > 0) {
                    this.selectedIndex--;
                }
            },

            selectResult() {
                if (this.results.length > 0) {
                    const item = this.results[this.selectedIndex];
                    this.navigateTo(item.url);
                }
            },

            navigateTo(url) {
                window.location.href = url;
                this.isOpen = false;
            }
        }
    }
</script>
